general {
    # Quickshell lockscreen; theme: lock.theme in ~/.config/theme/theme.json
    lock_cmd        = ~/.local/bin/lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# ── 4 min: warn ────────────────────────────────────────────────
listener {
    timeout  = 240
    on-timeout = notify-send --urgency=low --app-name=hypridle "Locking in 1 minute"
}

# ── 5 min: lock ────────────────────────────────────────────────
listener {
    timeout  = 300
    on-timeout = loginctl lock-session
}

# ── 10 min: screens off ────────────────────────────────────────
listener {
    timeout   = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
