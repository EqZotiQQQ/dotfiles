general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    no_fade_in          = false
    no_fade_out         = false
    ignore_empty_input  = true
}

# ── background ─────────────────────────────────────────────────
background {
    monitor =
    path    = /home/eqzotiqqq/my_projects/dotfiles/assets/car.png
    color   = rgb(1e1e2e)

    blur_passes    = 3
    blur_size      = 8
    brightness     = 0.55
    contrast       = 1.0
    vibrancy       = 0.2
    vibrancy_darkness = 0.0
}

# ── clock ──────────────────────────────────────────────────────
label {
    monitor =
    text        = cmd[update:1000] echo "$(date +'%H:%M')"
    color       = rgba(cdd6f4ff)
    font_size   = 88
    font_family = Iosevka Nerd Font Bold

    position = 0, 180
    halign   = center
    valign   = center
}

# ── date ───────────────────────────────────────────────────────
label {
    monitor =
    text        = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color       = rgba(a6adc8ff)
    font_size   = 20
    font_family = Iosevka Nerd Font

    position = 0, 90
    halign   = center
    valign   = center
}

# ── input field ────────────────────────────────────────────────
input-field {
    monitor =
    size             = 320, 52
    outline_thickness = 2
    dots_size        = 0.3
    dots_spacing     = 0.2
    dots_center      = true
    dots_rounding    = -1

    outer_color  = rgb(cba6f7)
    inner_color  = rgb(1e1e2e)
    font_color   = rgb(cdd6f4)
    check_color  = rgb(a6e3a1)
    fail_color   = rgb(f38ba8)
    capslock_color = rgb(f9e2af)

    placeholder_text = <span foreground="##6c7086">  password</span>
    fail_text        = <i>⚠  $FAIL ($ATTEMPTS)</i>

    fade_on_empty   = true
    rounding        = 8

    position = 0, -10
    halign   = center
    valign   = center
}

# ── user ───────────────────────────────────────────────────────
label {
    monitor =
    text        = $USER
    color       = rgba(cba6f7ff)
    font_size   = 14
    font_family = Iosevka Nerd Font Bold

    position = 0, -72
    halign   = center
    valign   = center
}
