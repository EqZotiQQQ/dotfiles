# ── hyprpaper ─────────────────────────────────────────────────
# Wallpapers live in ~/Pictures/
# Change active wallpaper at runtime: hyprpaper-set
# Random wallpaper at startup: set via exec-once in hyprland.conf

ipc = on
splash = false

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers
    fit_mode = fill
    timeout = 3600
}
