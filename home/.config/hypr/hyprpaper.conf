# ── hyprpaper ─────────────────────────────────────────────────
# Wallpapers live in ~/Pictures/wallpapers/
# Change active wallpaper at runtime: hyprpaper-set
# Updated by theme-apply from the selected preset.

ipc = on
splash = false

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/bloodsport.png
    fit_mode = fill
}
