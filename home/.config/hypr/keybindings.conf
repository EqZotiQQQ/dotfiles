###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = CTRL SHIFT, Q, exec, kill $(hyprctl activewindow -j | jq .pid)
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [1-9] (per-monitor, AwesomeWM style)
bind = $mainMod, 1, exec, ~/.local/scripts/ws-switch 1
bind = $mainMod, 2, exec, ~/.local/scripts/ws-switch 2
bind = $mainMod, 3, exec, ~/.local/scripts/ws-switch 3
bind = $mainMod, 4, exec, ~/.local/scripts/ws-switch 4
bind = $mainMod, 5, exec, ~/.local/scripts/ws-switch 5
bind = $mainMod, 6, exec, ~/.local/scripts/ws-switch 6
bind = $mainMod, 7, exec, ~/.local/scripts/ws-switch 7
bind = $mainMod, 8, exec, ~/.local/scripts/ws-switch 8
bind = $mainMod, 9, exec, ~/.local/scripts/ws-switch 9

# Move active window to workspace with mainMod + SHIFT + [1-9] (per-monitor)
bind = $mainMod SHIFT, 1, exec, ~/.local/scripts/ws-move 1
bind = $mainMod SHIFT, 2, exec, ~/.local/scripts/ws-move 2
bind = $mainMod SHIFT, 3, exec, ~/.local/scripts/ws-move 3
bind = $mainMod SHIFT, 4, exec, ~/.local/scripts/ws-move 4
bind = $mainMod SHIFT, 5, exec, ~/.local/scripts/ws-move 5
bind = $mainMod SHIFT, 6, exec, ~/.local/scripts/ws-move 6
bind = $mainMod SHIFT, 7, exec, ~/.local/scripts/ws-move 7
bind = $mainMod SHIFT, 8, exec, ~/.local/scripts/ws-move 8
bind = $mainMod SHIFT, 9, exec, ~/.local/scripts/ws-move 9

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Language switching
bind = ALT, Shift_L, exec, hyprctl switchxkblayout all next
bind = $mainMod, SPACE, exec, hyprctl switchxkblayout all next

# Lock screen
bind = $mainMod, L, exec, loginctl lock-session

# Clipboard (X11-style Insert shortcuts), requires: wtype wl-clipboard
bind = CTRL,  Insert, exec, wtype -M ctrl c -m ctrl
bind = SHIFT, Insert, exec, wl-paste | wtype -

# Screenshots
bind = , Print,         exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = SHIFT, Print,    exec, hyprshot -m output -o ~/Pictures/Screenshots
bind = $mainMod, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
