<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generic families for everything that doesn't name a font itself: GTK and Qt (gsettings: "Sans" /
     "Monospace"), Hyprland, browsers. Same fonts as theme.json "fonts" (ui / mono) -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Rubik</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Iosevka</family></prefer>
  </alias>
</fontconfig>
