# ╔══════════════════════════════════════════════════════════════╗
# ║                  kitty terminal configuration                ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Fonts ──────────────────────────────────────────────────────
font_family        Iosevka Nerd Font
bold_font          Iosevka Nerd Font Bold
italic_font        Iosevka Nerd Font Italic
bold_italic_font   Iosevka Nerd Font Bold Italic
font_size          13.0

# Slight negative letter spacing for a tighter, crisper look
letter_spacing     -0.5
# Subtly raise text so descenders breathe
adjust_baseline    0

# ── Cursor ─────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0

# ── Scrollback ─────────────────────────────────────────────────
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ──────────────────────────────────────────────────────
mouse_hide_wait         2.0
url_color               #89b4fa
url_style               curly
open_url_with           default
detect_urls             yes
copy_on_select          no

# ── Performance ────────────────────────────────────────────────
repaint_delay           8
input_delay             2
sync_to_monitor         yes

# ── Bell ───────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes

# ── Window layout ──────────────────────────────────────────────
remember_window_size    yes
initial_window_width    1200
initial_window_height   700

window_padding_width    12
window_border_width     1pt
draw_minimal_borders    yes
hide_window_decorations no

# ── Tab bar ────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Color scheme — Catppuccin Mocha ────────────────────────────
background              #1e1e2e
foreground              #cdd6f4
selection_background    #585b70
selection_foreground    #cdd6f4

cursor                  #f5e0dc
cursor_text_color       #1e1e2e

url_color               #89b4fa

active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f38ba8

# Active / inactive tabs
active_tab_background   #b4befe
active_tab_foreground   #1e1e2e
inactive_tab_background #313244
inactive_tab_foreground #cdd6f4
tab_bar_background      #181825

# The 16 terminal colours
color0   #45475a
color1   #f38ba8
color2   #a6e3a1
color3   #f9e2af
color4   #89b4fa
color5   #f5c2e7
color6   #94e2d5
color7   #bac2de

color8   #585b70
color9   #f38ba8
color10  #a6e3a1
color11  #f9e2af
color12  #89b4fa
color13  #f5c2e7
color14  #94e2d5
color15  #a6adc8

# Mark colours (used with kitty's mark feature)
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# ── Keyboard shortcuts ─────────────────────────────────────────
# Clear default map so nothing clashes
clear_all_shortcuts yes

kitty_mod ctrl+shift

# Clipboard
map kitty_mod+c  copy_to_clipboard
map kitty_mod+v  paste_from_clipboard

# Scrollback
map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home      scroll_home
map kitty_mod+end       scroll_end
map kitty_mod+h         show_scrollback

# Font size
map kitty_mod+equal   change_font_size all +1.0
map kitty_mod+minus   change_font_size all -1.0
map kitty_mod+0       change_font_size all 0

# Tabs
map kitty_mod+t      new_tab_with_cwd
map kitty_mod+w      close_tab
map kitty_mod+right  next_tab
map kitty_mod+left   previous_tab
map kitty_mod+1      goto_tab 1
map kitty_mod+2      goto_tab 2
map kitty_mod+3      goto_tab 3
map kitty_mod+4      goto_tab 4
map kitty_mod+5      goto_tab 5

# Windows / splits
map kitty_mod+enter       new_window_with_cwd
map kitty_mod+d           close_window
map kitty_mod+]           next_window
map kitty_mod+[           previous_window
map kitty_mod+f5          load_config_file

# Layouts: cycle with mod+l
map kitty_mod+l           next_layout
enabled_layouts           tall, fat, grid, stack

# Misc
map kitty_mod+f11   toggle_fullscreen
map kitty_mod+u     kitten unicode_input
map kitty_mod+e     kitten hints
map kitty_mod+p>f   kitten hints --type path --program -
map kitty_mod+p>l   kitten hints --type line --program -

# ── Shell integration ──────────────────────────────────────────
shell_integration           enabled
# Uncomment the next line to set your preferred shell explicitly:
# shell                     /usr/bin/zsh

# ── Misc ───────────────────────────────────────────────────────
editor                      .          # use $EDITOR / $VISUAL
close_on_child_death        no
# allow_remote_control        yes         # needed for e.g. kitty @ set-colors
listen_on                   unix:/tmp/kitty
term                        xterm-kitty
