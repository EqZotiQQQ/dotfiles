# ╔══════════════════════════════════════════════════════════════╗
# ║                   kitty — general settings                   ║
# ╚══════════════════════════════════════════════════════════════╝
# Included from kitty.conf.

# ── Fonts ──────────────────────────────────────────────────────
font_family        Iosevka Nerd Font
bold_font          family="Iosevka Nerd Font" style=Bold
italic_font        family="Iosevka Nerd Font" style=Italic
bold_italic_font   family="Iosevka Nerd Font" style="Bold Italic"
font_size          13.0

# Slight negative letter spacing for a tighter, crisper look
modify_font cell_width -0.5px
# Subtly raise text so descenders breathe
modify_font baseline

# ── Cursor ─────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0.5
cursor_stop_blinking_after 15.0
# Trail animation behind the cursor (ms the cursor must rest before a jump draws a trail; 0 = off)
cursor_trail           3

# ── Scrollback ─────────────────────────────────────────────────
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# ── Mouse ──────────────────────────────────────────────────────
mouse_hide_wait         2.0
url_color               #83a598
url_style               curly
open_url_with           default
detect_urls             yes
copy_on_select          no

# ── Performance ────────────────────────────────────────────────
repaint_delay           8
input_delay             2
sync_to_monitor         yes

# ── Bell ───────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0
window_alert_on_bell    yes

# ── Window layout ──────────────────────────────────────────────
remember_window_size    yes
initial_window_width    1200
initial_window_height   700

window_padding_width    12
window_border_width     1pt
draw_minimal_borders    yes
hide_window_decorations no

# ── Tab bar ────────────────────────────────────────────────────
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      " {index}: {title} "
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Shell integration ──────────────────────────────────────────
shell_integration           enabled
# Uncomment the next line to set your preferred shell explicitly:
# shell                     /usr/bin/zsh

# ── Misc ───────────────────────────────────────────────────────
editor                      .          # use $EDITOR / $VISUAL
close_on_child_death        no
# allow_remote_control        yes         # needed for e.g. kitty @ set-colors
term                        xterm-kitty
