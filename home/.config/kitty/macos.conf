# ╔══════════════════════════════════════════════════════════════╗
# ║                   kitty — macOS overrides                    ║
# ╚══════════════════════════════════════════════════════════════╝
# Included from kitty.conf via `include ${KITTY_OS}.conf`.

# ── Keyboard shortcuts ─────────────────────────────────────────

# Clipboard
map cmd+c        copy_to_clipboard
map cmd+v        paste_from_clipboard

# Line editing (escape sequences for zsh: alt+b / alt+f, Home / End)
map cmd+left            send_text all \x1bb
map cmd+right           send_text all \x1bf
map cmd+shift+left      send_text all \x1b[H
map cmd+shift+right     send_text all \x1b[F

# Tabs
map cmd+n            new_tab_with_cwd
map cmd+shift+n      new_os_window_with_cwd
map cmd+w            close_window
map cmd+shift+w      close_os_window
map cmd+b            previous_tab
map cmd+m            next_tab

# Windows / splits
map cmd+h                 launch --location=hsplit --cwd=current
map cmd+j                 launch --location=vsplit --cwd=current
map cmd+g                 previous_window
map cmd+k                 next_window
map cmd+shift+r           load_config_file
