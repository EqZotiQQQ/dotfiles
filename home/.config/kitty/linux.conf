# ╔══════════════════════════════════════════════════════════════╗
# ║                   kitty — Linux overrides                    ║
# ╚══════════════════════════════════════════════════════════════╝
# Included from kitty.conf via `include ${KITTY_OS}.conf`.
# Mirrors macos.conf with ctrl in place of cmd (SUPER is owned by Hyprland).
# ctrl+shift is kitty_mod, so maps below override kitty.conf:
#   ctrl+shift+left / right  Home / End here  (kitty.conf: previous_tab / next_tab)
# Not mirrored — kitty.conf keeps it:
#   ctrl+shift+w             close_tab        (macOS: close_os_window)

# ── Keyboard shortcuts ─────────────────────────────────────────

# Clipboard (copy with a selection, otherwise send ^C)
# map ctrl+c       copy_or_interrupt
# map ctrl+v       paste_from_clipboard

# Line editing (escape sequences for zsh: alt+b / alt+f, Home / End)
map ctrl+left           send_text all \x1bb
map ctrl+right          send_text all \x1bf
map ctrl+shift+left     send_text all \x1b[H
map ctrl+shift+right    send_text all \x1b[F

# Tabs
map ctrl+n           new_tab_with_cwd
map ctrl+shift+n     new_os_window_with_cwd
map ctrl+w           close_window
map ctrl+b           previous_tab
map ctrl+m           next_tab

# Windows / splits
map ctrl+h                launch --location=hsplit --cwd=current
map ctrl+j                launch --location=vsplit --cwd=current
map ctrl+g                previous_window
map ctrl+k                next_window
map ctrl+shift+r          load_config_file
